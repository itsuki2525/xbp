    <h1>街にあるわかりやすい看板</h1>
    <br>

    <div     style="display: flex; align-items: center; gap: 20px;">
  <img src="./7ADBC5C1-0610-4B24-BEDB-EA5BE4C9CD19_1_201_a.heic" width="500" alt="看板画像">
<div>  <h2 style="font-size: 30px; font-weight: 600; margin-bottom: 40px;">エニタイムフィットネス</h2>
  <p style="font-size: 30px; font-weight: 200;">この店はジムを経営している店の看板だが、その前提を知らなくても、この看板を見ることで運動・スポーツをする場所だと直感的に分かる。
</p>
</div>
</div>
<br>
<br><div     style="display: flex; align-items: center; gap: 20px;">
  <img src="./AB3F8C41-CC45-431C-8903-964C6C053523_1_201_a.heic" width="500" alt="看板画像">
  <div>  <h2 style="font-size: 30px; font-weight: 600; margin-bottom: 40px;">T'sたんたん　エキュート</h2>
  <p style="font-size: 30px; font-weight: 200;">これは上野駅内にあるラーメン屋だが、どんぶりに麺を箸で持っている看板で、一目でラーメン屋だと理解することができる。また、上野駅は外国人観光客が多いため、このような分かりやすい看板にしてると考察する。
</p>
</div>
</div>
<br>
<br><div     style="display: flex; align-items: center; gap: 20px;">
  <img src="./1230F56E-CC33-4994-B1EE-559240CA1EDA_1_201_a.jpeg" width="500" alt="看板画像">
  <div>  <h2 style="font-size: 30px; font-weight: 600; margin-bottom: 40px;">ウエルシア</h2>
  <p style="font-size: 30px; font-weight: 200;">赤色の正方形に書かれた「薬」という漢字一文字で表されているシンプルな看板だが、この漢字を知っていれば、ここは薬を扱う店なんだとすぐに理解することができる。
</p>
</div>
